name: "Regression Tests"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  regression:
    name: Booking-logic regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python3 -m compileall -q tests tools

      - name: Run regression suite
        run: python3 -m unittest discover -s tests -v

      - name: Data-dictionary drift gate
        run: |
          python3 tools/generate_data_dictionary.py
          git diff --exit-code docs/data-dictionary.md
